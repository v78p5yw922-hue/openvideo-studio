<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>审片</title>
<style>
  :root{--bg:#0e1116;--panel:#151a21;--line:#242c38;--fg:#e6edf6;--dim:#8b98a9;
        --ok:#37b26d;--bad:#e05555;--accent:#4c8dff}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:14px/1.6 -apple-system,"Segoe UI","PingFang SC",sans-serif}
  header{display:flex;gap:12px;align-items:center;padding:10px 16px;
         border-bottom:1px solid var(--line);background:var(--panel)}
  header .brand{font-weight:700}
  .spacer{flex:1}
  select,button,input{font:inherit;background:#0f141a;color:var(--fg);
        border:1px solid var(--line);border-radius:8px;padding:6px 10px}
  button{cursor:pointer}
  button.ok{background:#173a28;border-color:#2f6b49;color:#8ff0b0}
  button.bad{background:#3a1719;border-color:#6b2f33;color:#f0a0a0}
  main{display:grid;grid-template-columns:420px 1fr;gap:18px;padding:18px}
  .list{max-height:calc(100vh - 110px);overflow:auto}
  .item{padding:8px 10px;border:1px solid var(--line);border-radius:8px;
        margin-bottom:6px;cursor:pointer}
  .item.on{border-color:var(--accent)}
  .item .s{font-size:12px;color:var(--dim)}
  .stage{display:flex;flex-direction:column;gap:10px;align-items:center}
  video{max-height:64vh;background:#000;border-radius:10px}
  .meta{color:var(--dim);font-size:13px;text-align:center}
  .actions{display:flex;gap:10px;align-items:center}
  .empty{color:var(--dim);padding:40px;text-align:center}
  .flash{min-height:20px;font-size:13px}
  .okc{color:var(--ok)} .badc{color:var(--bad)}
</style>
</head>
<body>
<header>
  <span class="brand">审片</span>
  <select id="proj" onchange="load()"></select>
  <span class="spacer"></span>
  <button class="ok" onclick="passAll()">✅ 全部通过</button>
  <span id="count" class="meta"></span>
  <a id="back" href="/" style="color:var(--accent);text-decoration:none;font-size:13px">← 回到生产线</a>
</header>
<main>
  <div class="list" id="list"><div class="empty">加载中…</div></div>
  <div class="stage" id="stage"><div class="empty">左边选一个镜头</div></div>
</main>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let PID = '', SHOTS = [], CUR = null;

async function api(p, o) {
  const r = await fetch(p, o); const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.detail || j.error || ('HTTP ' + r.status));
  return j;
}

async function boot() {
  const ps = await api('/api/projects');
  $('#proj').innerHTML = ps.projects.map(p => `<option value="${esc(p.id)}">${esc(p.title)}</option>`).join('');
  const want = new URLSearchParams(location.search).get('project');
  if (want && ps.projects.some(p => p.id === want)) $('#proj').value = want;
  const back = $('#back');
  if (back) back.href = '/?project=' + encodeURIComponent($('#proj').value);
  if (ps.projects.length) { PID = $('#proj').value; load(); }
}

async function load() {
  PID = $('#proj').value;
  const back = $('#back');
  if (back) back.href = '/?project=' + encodeURIComponent(PID);
  const r = await api(`/api/projects/${encodeURIComponent(PID)}/review-queue`);
  SHOTS = r.shots;
  $('#count').textContent = `待审 ${r.total}`;
  if (!SHOTS.length) {
    $('#list').innerHTML = '<div class="empty">没有待审镜头<br><span class="s">渲完之后会自动出现在这里</span></div>';
    $('#stage').innerHTML = '<div class="empty">—</div>';
    return;
  }
  $('#list').innerHTML = SHOTS.map((s, i) => `
    <div class="item ${CUR && CUR.shot_id === s.shot_id ? 'on' : ''}" data-i="${i}">
      <b>${esc(s.shot_id)}</b> · ${esc(s.scene_id)}
      <div class="s">${esc((s.cast || []).join('、') || '空镜')} · ${esc(s.camera)} · v${s.take.version}</div>
    </div>`).join('');
  document.querySelectorAll('.item').forEach(node => node.onclick = () => {
    CUR = SHOTS[+node.dataset.i]; paint();
  });
  if (!CUR) { CUR = SHOTS[0]; }
  paint();
}

function paint() {
  const s = CUR;
  document.querySelectorAll('.item').forEach(n =>
    n.classList.toggle('on', SHOTS[+n.dataset.i].shot_id === s.shot_id));
  $('#stage').innerHTML = `
    <video src="/media/${encodeURIComponent(PID)}/${encodeURIComponent(s.shot_id)}/${s.take.version}"
           controls autoplay muted loop></video>
    <div class="meta">${esc(s.shot_id)} · ${esc(s.scene_id)} · ${esc(s.transition)}
      · ${Math.round(s.take.elapsed_s || 0)}s · v${s.take.version}</div>
    <div class="meta">台词：${esc((s.dialogue || '无').replace(/<\/?d>/g, ''))}</div>
    <div class="actions">
      <button onclick="step(-1)">‹ 上一镜</button>
      <button class="ok" onclick="judge('pass')">通过</button>
      <button class="bad" onclick="judge('reject')">打回</button>
      <button onclick="step(1)">下一镜 ›</button>
      <select id="reason">
        <option>构图</option><option>角色不像</option><option>环境不对</option>
        <option>动作不符</option><option>光色不对</option><option>口型/台词</option>
      </select>
    </div>
    <div class="flash" id="flash"></div>`;
}

function step(delta) {
  if (!SHOTS.length) return;
  const i = SHOTS.findIndex(s => s.shot_id === CUR.shot_id);
  const j = (i + delta + SHOTS.length) % SHOTS.length;
  CUR = SHOTS[j];
  paint();
}

async function passAll() {
  if (!SHOTS.length) return;
  if (!confirm(`把当前待审的 ${SHOTS.length} 镜全部通过？`)) return;
  let done = 0;
  for (const s of SHOTS) {
    await api(`/api/projects/${encodeURIComponent(PID)}/review`, {method:'POST',
      headers:{'content-type':'application/json'},
      body: JSON.stringify({shot_id: s.shot_id, verdict: 'pass', reason: ''})});
    done++;
    $('#flash').className = 'flash okc';
    $('#flash').textContent = `已通过 ${done}/${SHOTS.length}…`;
  }
  CUR = null;
  await load();
  $('#flash').className = 'flash okc';
  $('#flash').textContent = '全部通过，没有待审了';
}

async function judge(verdict) {
  const reason = verdict === 'reject' ? $('#reason').value : '';
  await api(`/api/projects/${encodeURIComponent(PID)}/review`, {method:'POST',
    headers:{'content-type':'application/json'},
    body: JSON.stringify({shot_id: CUR.shot_id, verdict, reason})});
  $('#flash').className = 'flash ' + (verdict === 'pass' ? 'okc' : 'badc');
  $('#flash').textContent = verdict === 'pass' ? '已通过' : `已打回（${reason}）`;
  const keep = CUR.shot_id;
  await load();
  const next = SHOTS.find(s => s.shot_id === keep) || SHOTS[0];
  if (next) { CUR = next; paint(); }
}

boot();
</script>
</body>
</html>

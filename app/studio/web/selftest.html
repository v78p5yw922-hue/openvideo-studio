<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Studio 自检</title>
<style>
  body{margin:0;background:#0e1116;color:#e6edf6;font:14px/1.6 -apple-system,"Segoe UI","PingFang SC",sans-serif}
  .wrap{max-width:760px;margin:40px auto;padding:0 20px}
  h1{font-size:20px;margin:0 0 4px}
  p.sub{color:#8b98a9;margin:0 0 22px;font-size:13px}
  table{width:100%;border-collapse:collapse}
  td{padding:10px 8px;border-bottom:1px solid #242c38;vertical-align:top}
  td.s{width:52px;text-align:center;font-size:16px}
  .ok{color:#37b26d}.bad{color:#e05555}
  .d{color:#8b98a9;font-size:12.5px}
  .sum{margin-top:18px;font-size:15px}
  code{background:#151a21;padding:1px 6px;border-radius:5px;font-size:12.5px}
  a{color:#4c8dff}
</style>
</head>
<body>
<div class="wrap">
  <h1>Studio 自检</h1>
  <p class="sub">在真实数据库上跑一遍关键不变量，用临时项目，跑完即删。不占 GPU。</p>
  <table id="t"><tr><td class="d">运行中…</td></tr></table>
  <div class="sum" id="sum"></div>
  <p class="sub" style="margin-top:26px">
    返回 <a href="/">生产线</a> · 接口 <code>/api/selftest</code>
  </p>
</div>
<script>
async function run() {
  const r = await fetch('/api/selftest').then(x => x.json());
  document.getElementById('t').innerHTML = r.checks.map(c => `
    <tr><td class="s ${c.ok ? 'ok' : 'bad'}">${c.ok ? '✓' : '✗'}</td>
        <td>${c.name}<div class="d">${String(c.detail).replace(/[<>&]/g, '')}</div></td></tr>`).join('');
  const el = document.getElementById('sum');
  el.innerHTML = `通过 <b>${r.passed}</b> / ${r.total}`;
  el.className = 'sum ' + (r.passed === r.total ? 'ok' : 'bad');
}
run();
</script>
</body>
</html>
